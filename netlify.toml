# Netlify config for the Next.js frontend, which lives in web/.
[build]
  base = "web"
  command = "npm run build"
  # Point publish at Next's build output (path is relative to the repo root).
  # Without this it defaults to the base dir, and the Next plugin rejects
  # publish == base.
  publish = "web/.next"

[build.environment]
  NODE_VERSION = "20"

# Official Next.js runtime (SSR/ISR/static + the App Router). Netlify installs
# this automatically; listing it here makes the dependency explicit.
[[plugins]]
  package = "@netlify/plugin-nextjs"
